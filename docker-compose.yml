# Servicio OCR (FastAPI + Moondream). Ubicación real del código: carpeta ocr/ del repo.
# El módulo Nest vive en backend/src/ocr/ y solo hace HTTP a este servicio.
#
# Requisitos GPU (NVIDIA): Docker + nvidia-container-toolkit en el host.
# Ver: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#
# Solo GPU (NVIDIA): descomenta `gpus:` y usa build con USE_GPU=1 (imagen CUDA o runtime NVIDIA en host).
#
services:
  ocr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USE_GPU: "0"
    image: gastos-ocr:local
    container_name: gastos-ocr
    ports:
      - "${OCR_PORT:-8001}:8001"
    environment:
      PORT: "8001"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Por defecto 2b (mejor VLM). VRAM/RAM justa: export MOONDREAM_ONNX_VARIANT=0.5b o fija "0.5b" aquí
      MOONDREAM_ONNX_VARIANT: "${MOONDREAM_ONNX_VARIANT:-2b}"
      # MOONDREAM_API_KEY: ""           # alternativa: nube, sin pesos locales
      # MOONDREAM_MODEL_PATH: ""        # o .mf/.gz ya descargado (montar volumen)
      # HF_HOME ya es /var/cache/huggingface en el Dockerfile
    # Variables extra: copia .env.example → .env en esta carpeta o define aquí bajo `environment`.
    volumes:
      - huggingface_ocr_cache:/var/cache/huggingface
    # GPUs: sólo si hiciste build con USE_GPU=1 *y* tienes nvidia-container-toolkit.
    # gpus: all
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  huggingface_ocr_cache:
