
services:
  ocr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USE_GPU: "${USE_GPU:-1}"
    image: gastos-ocr:local
    container_name: gastos-ocr
    ports:
      - "${OCR_PORT:-8001}:8001"
    environment:
      PORT: "8001"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MOONDREAM_ONNX_VARIANT: "${MOONDREAM_ONNX_VARIANT:-2b}"
      OCR_VLM_PROMPT_MODE: "${OCR_VLM_PROMPT_MODE:-transcribe}"
    volumes:
      - huggingface_ocr_cache:/var/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  huggingface_ocr_cache:
